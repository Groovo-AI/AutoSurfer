[project]
name = "autosurfer"
version = "0.1"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "browserbase>=1.4.0",
    "langchain>=0.3.25",
    "langchain-community>=0.3.25",
    "langchain-openai>=0.3.22",
    "mss>=10.0.0",
    "openai>=1.86.0",
    "playwright>=1.52.0",
    "playwright-stealth>=2.0.0",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.1.0",
    "undetected-chromedriver>=3.5.5",
    "watchfiles>=1.0.5",
    "camoufox[geoip] (>=0.4.11,<0.5.0)",
]

[project.scripts]
dev = "runner:main"
